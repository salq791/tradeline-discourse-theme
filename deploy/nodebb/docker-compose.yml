name: tradeline-community

services:
  nodebb:
    image: ghcr.io/nodebb/nodebb:latest
    restart: unless-stopped
    expose:
      - "4567"
    environment:
      NODE_ENV: production
      NODEBB_URL: ${NODEBB_URL:-https://community.tradelineconsulting.com}
      NODEBB_PORT: "4567"
      NODEBB_DB: postgres
      NODEBB_DB_HOST: nodebb-db
      NODEBB_DB_PORT: "5432"
      NODEBB_DB_NAME: nodebb
      NODEBB_DB_USER: nodebb
      NODEBB_DB_PASSWORD: ${DB_PASSWORD}
      # SES SMTP via netcup-friendly port 2587
      NODEBB_SMTP_HOST: ${SMTP_HOST:-email-smtp.ca-central-1.amazonaws.com}
      NODEBB_SMTP_PORT: "${SMTP_PORT:-2587}"
      NODEBB_SMTP_USER: ${SMTP_USER}
      NODEBB_SMTP_PASS: ${SMTP_PASSWORD}
      NODEBB_SMTP_FROM: ${SMTP_FROM:-do-not-reply@tradelineconsulting.com}
    volumes:
      - nodebb-data:/usr/src/app/build
      - nodebb-public-uploads:/usr/src/app/public/uploads
      - nodebb-config:/opt/config
    depends_on:
      nodebb-db:
        condition: service_healthy

  nodebb-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: nodebb
      POSTGRES_USER: nodebb
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - nodebb-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nodebb"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nodebb-data:
  nodebb-public-uploads:
  nodebb-config:
  nodebb-postgres-data:
